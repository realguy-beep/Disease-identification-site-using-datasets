<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes Canvas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .title-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 7px 12px;
      flex: 1;
      outline: none;
      transition: border-color 0.2s;
    }
    .title-input:focus {
      border-color: #6366f1;
    }
    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #4f46e5; }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn.secondary:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }

    /* Rich Formatting Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .tool-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 3px;
    }

    /* Tags Bar & Pills */
    .tags-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag-pill {
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag-del-btn {
      background: none;
      border: none;
      color: #818cf8;
      cursor: pointer;
      font-size: 11px;
      padding: 0;
    }
    .tag-del-btn:hover { color: #f87171; }
    .tag-input {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11.5px;
      outline: none;
      min-width: 100px;
    }

    /* Editor Area */
    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
    }
    .rich-editor {
      width: 100%;
      height: 100%;
      padding: 14px;
      overflow-y: auto;
      outline: none;
      color: #f1f5f9;
      font-size: 13.5px;
      line-height: 1.65;
    }
    .rich-editor:empty:before {
      content: attr(data-placeholder);
      color: #475569;
      pointer-events: none;
    }
    .rich-editor h1 { font-size: 1.5em; color: #fff; margin-bottom: 8px; }
    .rich-editor h2 { font-size: 1.3em; color: #e2e8f0; margin-bottom: 6px; }
    .rich-editor h3 { font-size: 1.1em; color: #cbd5e1; margin-bottom: 4px; }
    .rich-editor blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 10px;
      margin: 8px 0;
      color: #94a3b8;
      font-style: italic;
    }
    .rich-editor pre, .rich-editor code {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 4px;
      font-family: monospace;
      padding: 2px 4px;
      color: #38bdf8;
    }
    .rich-editor ul, .rich-editor ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .cross-link {
      color: #818cf8;
      text-decoration: underline;
      cursor: pointer;
      background: rgba(99, 102, 241, 0.1);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      padding-top: 2px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-dot.syncing { background: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <input type="text" id="noteTitle" class="title-input" placeholder="Note Title...">
    <button class="btn secondary" id="btnInsertLink" title="Link to another note">🔗 Link</button>
    <button class="btn" id="btnSaveState">Save Note</button>
  </div>

  <!-- Rich Formatting Toolbar -->
  <div class="toolbar">
    <button class="tool-btn" onclick="execFmt('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tool-btn" onclick="execFmt('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tool-btn" onclick="execFmt('underline')" title="Underline"><u>U</u></button>
    <button class="tool-btn" onclick="execFmt('strikeThrough')" title="Strikethrough"><s>S</s></button>
    <div class="tool-divider"></div>
    <button class="tool-btn" onclick="execFmt('formatBlock', '<h1>')" title="Heading 1">H1</button>
    <button class="tool-btn" onclick="execFmt('formatBlock', '<h2>')" title="Heading 2">H2</button>
    <button class="tool-btn" onclick="execFmt('formatBlock', '<h3>')" title="Heading 3">H3</button>
    <button class="tool-btn" onclick="execFmt('formatBlock', '<p>')" title="Paragraph">¶</button>
    <div class="tool-divider"></div>
    <button class="tool-btn" onclick="execFmt('insertUnorderedList')" title="Bullet List">• List</button>
    <button class="tool-btn" onclick="execFmt('insertOrderedList')" title="Numbered List">1. List</button>
    <button class="tool-btn" onclick="execFmt('formatBlock', '<blockquote>')" title="Quote">“ Quote</button>
    <button class="tool-btn" onclick="insertCode()" title="Code Block">&lt;/&gt;</button>
    <button class="tool-btn" onclick="execFmt('insertHorizontalRule')" title="Divider">—</button>
  </div>

  <!-- Tag Pills -->
  <div class="tags-container" id="tagsContainer">
    <span style="font-size:11px; color:#64748b;">🏷️</span>
    <div id="tagPills" style="display:flex; gap:4px; flex-wrap:wrap;"></div>
    <input type="text" id="tagInput" class="tag-input" placeholder="+ Add tag (Enter)">
  </div>

  <!-- Rich Editor -->
  <div class="editor-container">
    <div 
      id="richEditor" 
      class="rich-editor" 
      contenteditable="true" 
      data-placeholder="Write ideas, notes, task lists, and cross-references..."
    ></div>
  </div>

  <div class="footer">
    <div class="status">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Sandboxed & Ready</span>
    </div>
    <div style="display: flex; gap: 12px;">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 chars</span>
    </div>
  </div>

  <script src="/apps/loom-sdk.js"></script>
  <script>
    const noteTitle = document.getElementById('noteTitle');
    const richEditor = document.getElementById('richEditor');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');
    const btnSaveState = document.getElementById('btnSaveState');
    const btnInsertLink = document.getElementById('btnInsertLink');
    const tagInput = document.getElementById('tagInput');
    const tagPills = document.getElementById('tagPills');

    let currentDraftId = null;
    let tags = ['ideas', 'notes'];

    // Initialize Loom SDK
    LoomSDK.init().then(info => {
      statusText.textContent = `Connected (${info.permissions.length} capabilities)`;
      loadDraft();
    }).catch(err => {
      statusDot.className = 'status-dot syncing';
      statusText.textContent = 'Standalone mode';
    });

    function execFmt(command, value = null) {
      document.execCommand(command, false, value);
      richEditor.focus();
      updateCounts();
      scheduleDraftSave();
    }

    function insertCode() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const codeNode = document.createElement('code');
      codeNode.textContent = range.toString() || 'code snippet';
      range.deleteContents();
      range.insertNode(codeNode);
      updateCounts();
      scheduleDraftSave();
    }

    // Cross-linking
    btnInsertLink.addEventListener('click', () => {
      const linkTitle = prompt('Enter cross-reference note title (e.g. Project Roadmap):');
      if (!linkTitle) return;
      document.execCommand('insertHTML', false, `<span class="cross-link" title="Cross-link: ${linkTitle}">[[${linkTitle}]]</span>&nbsp;`);
      updateCounts();
      scheduleDraftSave();
    });

    // Tag management
    function renderTags() {
      tagPills.innerHTML = tags.map((t, idx) => `
        <span class="tag-pill">
          #${t}
          <button class="tag-del-btn" onclick="removeTag(${idx})">×</button>
        </span>
      `).join('');
    }

    function removeTag(idx) {
      tags.splice(idx, 1);
      renderTags();
      scheduleDraftSave();
    }

    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = tagInput.value.replace(/#/g, '').trim();
        if (val && !tags.includes(val)) {
          tags.push(val);
          renderTags();
          tagInput.value = '';
          scheduleDraftSave();
        }
      }
    });

    // Word and Char counter
    function updateCounts() {
      const text = richEditor.innerText || '';
      charCount.textContent = `${text.length} chars`;
      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      wordCount.textContent = `${words.length} words`;
    }

    richEditor.addEventListener('input', () => {
      updateCounts();
      scheduleDraftSave();
    });

    noteTitle.addEventListener('input', scheduleDraftSave);

    // Auto-save draft
    let saveTimeout;
    function scheduleDraftSave() {
      statusDot.className = 'status-dot syncing';
      statusText.textContent = 'Saving draft...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        try {
          await LoomSDK.storage.set('notes_draft', {
            id: currentDraftId,
            title: noteTitle.value,
            tags: tags,
            htmlContent: richEditor.innerHTML,
            time: Date.now()
          });
          statusDot.className = 'status-dot';
          statusText.textContent = 'Draft autosaved';
        } catch (e) {
          statusText.textContent = 'Autosaved locally';
        }
      }, 600);
    }

    async function loadDraft() {
      try {
        const draft = await LoomSDK.storage.get('notes_draft');
        if (draft) {
          noteTitle.value = draft.title || '';
          if (draft.tags && Array.isArray(draft.tags)) tags = draft.tags;
          renderTags();
          richEditor.innerHTML = draft.htmlContent || draft.content || '';
          currentDraftId = draft.id || null;
          updateCounts();
        } else {
          renderTags();
        }
      } catch (e) {
        renderTags();
      }
    }

    // Save to Universal State
    btnSaveState.addEventListener('click', async () => {
      const title = noteTitle.value.trim() || 'Untitled Note';
      const content = richEditor.innerHTML;

      statusDot.className = 'status-dot syncing';
      statusText.textContent = 'Syncing to Universal State...';

      try {
        await LoomSDK.state.set({
          id: currentDraftId || undefined,
          type: 'note',
          title,
          content,
          tags: tags,
          links: []
        });

        statusDot.className = 'status-dot';
        statusText.textContent = 'Saved to Universal State ✓';
        setTimeout(() => { statusText.textContent = 'Ready'; }, 3000);
      } catch (err) {
        statusDot.className = 'status-dot syncing';
        statusText.textContent = 'Save error: ' + err.message;
      }
    });

    renderTags();
  </script>
</body>
</html>

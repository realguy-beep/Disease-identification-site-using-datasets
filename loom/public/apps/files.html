<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual Files</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .nav-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .breadcrumb-item {
      cursor: pointer;
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .breadcrumb-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #3b82f6;
    }
    .btn.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }
    .btn.primary:hover { background: #1d4ed8; }
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 150px;
      background: rgba(0, 0, 0, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .side-item {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .side-item:hover, .side-item.active {
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
    }
    .main-view {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    .file-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .file-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }
    .file-icon {
      font-size: 24px;
    }
    .file-name {
      font-size: 11px;
      color: #e2e8f0;
      word-break: break-all;
      line-height: 1.3;
      max-height: 28px;
      overflow: hidden;
    }
    .file-size {
      font-size: 9.5px;
      color: #64748b;
    }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      flex-direction: column;
    }
    .preview-box {
      flex: 1;
      background: #11131f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-header {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    textarea.editor {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    .quota-bar {
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10.5px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-track {
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 4%;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="nav-breadcrumbs" id="breadcrumbs">
      <span class="breadcrumb-item" onclick="navigateTo(null)">Root</span>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="createNewFolder()">+ Folder</button>
      <button class="btn" onclick="createNewFile()">+ File</button>
      <label class="btn primary" style="cursor:pointer;">
        ↑ Upload
        <input type="file" id="hostUpload" onchange="uploadHostFile(event)" style="display:none;">
      </label>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="side-item active" id="sideRoot" onclick="switchSide('root')">📁 All Files</div>
      <div class="side-item" id="sideTrash" onclick="switchSide('trash')">🗑️ Trash</div>
    </div>

    <div class="main-view">
      <div class="file-grid" id="grid">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Quota Footer -->
  <div class="quota-bar">
    <span id="quotaText">Loading quota...</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="progress-track">
        <div class="progress-fill" id="quotaBar"></div>
      </div>
      <span id="quotaPercent">1%</span>
    </div>
  </div>

  <!-- Text Preview / Edit Modal -->
  <div class="preview-modal" id="previewModal">
    <div class="preview-box">
      <div class="preview-header">
        <span id="previewTitle" style="font-size:12px; font-weight:600;">File</span>
        <div style="display:flex; gap:6px;">
          <button class="btn" onclick="downloadCurrentFile()">Download</button>
          <button class="btn primary" onclick="saveCurrentFile()">Save</button>
          <button class="btn" onclick="closePreview()">Close</button>
        </div>
      </div>
      <div class="preview-body">
        <textarea class="editor" id="fileEditor"></textarea>
      </div>
    </div>
  </div>

  <script src="/apps/loom-sdk.js"></script>
  <script>
    let currentFolderId = null;
    let currentView = 'root'; // 'root' | 'trash'
    let currentEditingNode = null;
    let folderTrail = [{ id: null, name: 'Root' }];

    LoomSDK.init().then(() => {
      refreshView();
    }).catch(e => {
      console.warn(e);
      refreshView();
    });

    async function refreshView() {
      renderBreadcrumbs();
      try {
        const res = await LoomSDK.state.query({ search: '__vfs__' });
        // Use postMessage direct VFS commands if available, or RPC
      } catch (e) {}

      // Request directory contents via postMessage
      window.parent.postMessage({
        jsonrpc: '2.0',
        id: 'vfs_list_' + Date.now(),
        token: new URLSearchParams(location.search).get('token'),
        appId: 'loom.files',
        method: 'state:query', // falls back gracefully
        params: {}
      }, '*');

      loadVFSData();
    }

    // Direct fetch from window.parent IndexedDB bridge
    async function loadVFSData() {
      // Send RPC for VFS contents
      window.parent.postMessage({
        jsonrpc: '2.0',
        id: 'req_vfs_' + Date.now(),
        token: new URLSearchParams(location.search).get('token'),
        appId: 'loom.files',
        method: 'vfs:list',
        params: { parentId: currentFolderId, isTrash: currentView === 'trash' }
      }, '*');
    }

    // Handle incoming VFS responses
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || data.jsonrpc !== '2.0') return;

      if (data.id && data.id.startsWith('req_vfs_') && data.result) {
        renderGrid(data.result.items || []);
        updateQuotaUI(data.result.quota);
      }
    });

    function renderBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      bc.innerHTML = '';
      folderTrail.forEach((item, index) => {
        const span = document.createElement('span');
        span.className = 'breadcrumb-item';
        span.textContent = item.name;
        span.onclick = () => {
          folderTrail = folderTrail.slice(0, index + 1);
          currentFolderId = item.id;
          loadVFSData();
          renderBreadcrumbs();
        };
        bc.appendChild(span);
        if (index < folderTrail.length - 1) {
          const sep = document.createElement('span');
          sep.textContent = '/';
          bc.appendChild(sep);
        }
      });
    }

    function renderGrid(items) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#64748b; font-size:12px; margin-top:40px;">This folder is empty.</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'file-card';

        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = item.type === 'folder' ? '📁' : '📄';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = item.name;

        const size = document.createElement('div');
        size.className = 'file-size';
        size.textContent = item.type === 'folder' ? 'Folder' : (item.size < 1024 ? item.size + ' B' : (item.size/1024).toFixed(1) + ' KB');

        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(size);

        card.onclick = () => {
          if (item.type === 'folder') {
            folderTrail.push({ id: item.id, name: item.name });
            currentFolderId = item.id;
            loadVFSData();
            renderBreadcrumbs();
          } else {
            openFilePreview(item);
          }
        };

        // Context menu / quick delete
        card.oncontextmenu = (e) => {
          e.preventDefault();
          if (confirm(`Move "${item.name}" to Trash?`)) {
            sendVFSCommand('vfs:trash', { id: item.id });
          }
        };

        grid.appendChild(card);
      });
    }

    function updateQuotaUI(quota) {
      if (!quota) return;
      const mbUsed = (quota.usedBytes / (1024 * 1024)).toFixed(2);
      const maxMb = (quota.maxBytes / (1024 * 1024)).toFixed(0);
      const pct = Math.min(100, Math.round((quota.usedBytes / quota.maxBytes) * 100));

      document.getElementById('quotaText').textContent = `${mbUsed} MB / ${maxMb} MB used (${quota.fileCount} files)`;
      document.getElementById('quotaBar').style.width = Math.max(2, pct) + '%';
      document.getElementById('quotaPercent').textContent = pct + '%';
    }

    function switchSide(mode) {
      currentView = mode;
      document.getElementById('sideRoot').className = 'side-item' + (mode === 'root' ? ' active' : '');
      document.getElementById('sideTrash').className = 'side-item' + (mode === 'trash' ? ' active' : '');
      if (mode === 'trash') {
        folderTrail = [{ id: null, name: 'Trash' }];
        currentFolderId = null;
      } else {
        folderTrail = [{ id: null, name: 'Root' }];
        currentFolderId = null;
      }
      renderBreadcrumbs();
      loadVFSData();
    }

    function createNewFolder() {
      const name = prompt('Enter folder name:', 'New Folder');
      if (name) sendVFSCommand('vfs:createFolder', { name, parentId: currentFolderId });
    }

    function createNewFile() {
      const name = prompt('Enter file name (e.g. notes.txt, memo.md):', 'document.txt');
      if (name) sendVFSCommand('vfs:createFile', { name, parentId: currentFolderId, content: '' });
    }

    function uploadHostFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      const isText = file.type.startsWith('text/') || file.name.endsWith('.md') || file.name.endsWith('.json') || file.name.endsWith('.js');

      reader.onload = () => {
        sendVFSCommand('vfs:createFile', {
          name: file.name,
          parentId: currentFolderId,
          content: reader.result,
          mimeType: file.type || 'text/plain'
        });
      };

      if (isText) reader.readAsText(file);
      else reader.readAsDataURL(file);
    }

    function openFilePreview(item) {
      currentEditingNode = item;
      document.getElementById('previewTitle').textContent = item.name;
      document.getElementById('fileEditor').value = item.content || '';
      document.getElementById('previewModal').style.display = 'flex';
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
      currentEditingNode = null;
    }

    function saveCurrentFile() {
      if (!currentEditingNode) return;
      const content = document.getElementById('fileEditor').value;
      sendVFSCommand('vfs:updateFile', { id: currentEditingNode.id, content });
      closePreview();
    }

    function downloadCurrentFile() {
      if (!currentEditingNode) return;
      const blob = new Blob([document.getElementById('fileEditor').value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentEditingNode.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function sendVFSCommand(method, params) {
      window.parent.postMessage({
        jsonrpc: '2.0',
        id: 'req_vfs_' + Date.now(),
        token: new URLSearchParams(location.search).get('token'),
        appId: 'loom.files',
        method: method,
        params: params || {}
      }, '*');
      setTimeout(loadVFSData, 200);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-bar {
      display: flex;
      gap: 6px;
    }
    input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      flex: 1;
      outline: none;
    }
    input:focus { border-color: #f59e0b; }
    select {
      background: #181b28;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      padding: 0 8px;
      outline: none;
    }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #d97706; color: #fff; }
    .task-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .task-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .task-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .task-item.completed {
      opacity: 0.55;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #f59e0b;
    }
    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .task-text {
      font-size: 13px;
      color: #f1f5f9;
    }
    .task-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }
    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .badge-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-low { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .del-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }
    .del-btn:hover { color: #ef4444; }
    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="input-bar">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <select id="taskPriority">
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="low">Low</option>
    </select>
    <button class="btn" id="btnAddTask">Add</button>
  </div>

  <div class="task-list" id="taskList">
    <!-- Tasks loaded from Universal State -->
  </div>

  <div class="footer">
    <span id="statusInfo">Connecting to Universal State...</span>
    <span id="stats">0 remaining</span>
  </div>

  <script src="/apps/loom-sdk.js"></script>
  <script>
    const taskInput = document.getElementById('taskInput');
    const taskPriority = document.getElementById('taskPriority');
    const btnAddTask = document.getElementById('btnAddTask');
    const taskList = document.getElementById('taskList');
    const statusInfo = document.getElementById('statusInfo');
    const stats = document.getElementById('stats');

    let tasks = [];

    LoomSDK.init().then(info => {
      statusInfo.textContent = 'Universal State synced';
      refreshTasks();
    }).catch(err => {
      statusInfo.textContent = 'Err: ' + err.message;
    });

    async function refreshTasks() {
      try {
        const res = await LoomSDK.state.query({ type: 'task' });
        tasks = res.items || [];
        render();
      } catch (e) {
        statusInfo.textContent = 'Query failed: ' + e.message;
      }
    }

    function render() {
      taskList.innerHTML = '';
      const pendingCount = tasks.filter(t => !t.metadata?.completed).length;
      stats.textContent = `${pendingCount} pending / ${tasks.length} total`;

      if (tasks.length === 0) {
        taskList.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; margin-top: 20px;">No tasks in current zone. Add one above!</div>';
        return;
      }

      tasks.forEach(task => {
        const completed = Boolean(task.metadata?.completed);
        const priority = task.metadata?.priority || 'medium';

        const item = document.createElement('div');
        item.className = 'task-item' + (completed ? ' completed' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'checkbox';
        cb.checked = completed;
        cb.onchange = async () => {
          const newCompleted = cb.checked;
          await LoomSDK.state.update(task.id, {
            metadata: Object.assign({}, task.metadata, { completed: newCompleted })
          });
          task.metadata = Object.assign({}, task.metadata, { completed: newCompleted });
          render();

          if (newCompleted && pendingCount === 1) {
            LoomSDK.notify('All Tasks Cleared!', 'You completed all pending focus tasks in this zone.');
          }
        };

        const content = document.createElement('div');
        content.className = 'task-content';

        const text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = task.title;

        const meta = document.createElement('div');
        meta.className = 'task-meta';
        const badge = document.createElement('span');
        badge.className = `badge badge-${priority}`;
        badge.textContent = priority;
        meta.appendChild(badge);

        if (task.tags && task.tags.length) {
          const tagsSpan = document.createElement('span');
          tagsSpan.style.color = '#64748b';
          tagsSpan.textContent = task.tags.map(t => '#' + t).join(' ');
          meta.appendChild(tagsSpan);
        }

        content.appendChild(text);
        content.appendChild(meta);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = async () => {
          await LoomSDK.state.delete(task.id);
          tasks = tasks.filter(t => t.id !== task.id);
          render();
        };

        item.appendChild(cb);
        item.appendChild(content);
        item.appendChild(delBtn);

        taskList.appendChild(item);
      });
    }

    btnAddTask.addEventListener('click', async () => {
      const title = taskInput.value.trim();
      if (!title) return;

      const priority = taskPriority.value;
      try {
        const res = await LoomSDK.state.create({
          type: 'task',
          title,
          content: '',
          tags: ['focus', priority],
          metadata: { completed: false, priority }
        });

        if (res && res.item) {
          tasks.unshift(res.item);
          taskInput.value = '';
          render();
        }
      } catch (err) {
        statusInfo.textContent = 'Add task failed: ' + err.message;
      }
    });

    taskInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnAddTask.click();
    });
  </script>
</body>
</html>

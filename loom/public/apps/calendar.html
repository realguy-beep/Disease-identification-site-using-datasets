<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loom Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      min-width: 140px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .btn.primary { background: #ec4899; border-color: #db2777; color: #fff; }
    .btn.primary:hover { background: #db2777; }

    .view-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 2px;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .view-btn.active { background: #ec4899; color: #fff; font-weight: 600; }

    .main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .calendar-grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      overflow-y: auto;
    }
    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }
    .days-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      grid-auto-rows: minmax(70px, 1fr);
    }
    .day-cell {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background 0.15s;
    }
    .day-cell:hover { background: rgba(255, 255, 255, 0.06); }
    .day-cell.other-month { opacity: 0.35; }
    .day-cell.today {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.08);
    }
    .day-num {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 2px;
    }
    .day-cell.today .day-num {
      color: #f472b6;
    }
    .day-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      flex: 1;
    }
    .event-chip {
      font-size: 9.5px;
      padding: 1px 4px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    /* Agenda Sidebar */
    .agenda-sidebar {
      width: 190px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .agenda-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }
    .agenda-item {
      padding: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid #ec4899;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .agenda-item-title { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    .agenda-item-time { font-size: 10px; color: #94a3b8; font-family: monospace; }

    /* Event Modal */
    .modal-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-box {
      width: 300px;
      background: #151825;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8);
    }
    .inp {
      background: #0d0f18;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="nav-controls">
      <button class="btn" onclick="prevMonth()">‹</button>
      <div class="month-title" id="monthTitle">September 2026</div>
      <button class="btn" onclick="nextMonth()">›</button>
      <button class="btn" onclick="goToToday()">Today</button>
    </div>

    <div style="display: flex; gap: 8px;">
      <div class="view-toggle">
        <button class="view-btn active" id="btnMonthView" onclick="setView('month')">Month</button>
        <button class="view-btn" id="btnWeekView" onclick="setView('week')">Week</button>
      </div>
      <button class="btn primary" onclick="openNewEventModal()">+ Event</button>
    </div>
  </div>

  <div class="main-body">
    <div class="calendar-grid-container">
      <div class="weekdays-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="agenda-sidebar">
      <div class="agenda-title">Upcoming Agenda</div>
      <div id="agendaList" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>
  </div>

  <!-- New Event Modal -->
  <div class="modal-backdrop" id="eventModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; font-weight:600;">Create Event</span>
        <button onclick="closeEventModal()" style="background:none; border:none; color:#64748b; cursor:pointer;">✕</button>
      </div>

      <input type="text" id="evtTitle" class="inp" placeholder="Event Title...">
      <input type="date" id="evtDate" class="inp">
      
      <div style="display:flex; gap:6px;">
        <input type="time" id="evtStartTime" class="inp" value="10:00">
        <input type="time" id="evtEndTime" class="inp" value="11:00">
      </div>

      <select id="evtCategory" class="inp">
        <option value="#ec4899">Personal (Pink)</option>
        <option value="#6366f1">Work (Indigo)</option>
        <option value="#10b981">Focus (Emerald)</option>
        <option value="#f59e0b">Urgent (Amber)</option>
      </select>

      <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:4px;">
        <button class="btn" onclick="closeEventModal()">Cancel</button>
        <button class="btn primary" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
  </div>

  <script src="/apps/loom-sdk.js"></script>
  <script>
    let currentDate = new Date();
    let currentView = 'month';
    let events = [
      { id: 'evt-1', title: 'Loom OS Launch Sprint', date: '2026-09-07', startTime: '09:00', endTime: '11:00', color: '#6366f1' },
      { id: 'evt-2', title: 'Architecture Review', date: '2026-09-07', startTime: '14:00', endTime: '15:30', color: '#10b981' },
      { id: 'evt-3', title: 'Deep Work Sprint', date: '2026-09-08', startTime: '10:00', endTime: '12:00', color: '#ec4899' },
      { id: 'evt-4', title: 'System Diagnostics', date: '2026-09-09', startTime: '16:00', endTime: '17:00', color: '#f59e0b' }
    ];

    LoomSDK.init().then(() => {
      loadEventsFromState();
    }).catch(e => {
      renderCalendar();
      renderAgenda();
    });

    async function loadEventsFromState() {
      try {
        const saved = await LoomSDK.state.query({ type: 'calendar_event' });
        if (saved && saved.length > 0) {
          const mapped = saved.map(s => {
            try {
              return JSON.parse(s.content);
            } catch (e) {
              return null;
            }
          }).filter(Boolean);
          if (mapped.length > 0) events = mapped;
        }
      } catch (e) {}
      renderCalendar();
      renderAgenda();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      document.getElementById('monthTitle').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      // Previous month days
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        grid.innerHTML += `<div class="day-cell other-month"><div class="day-num">${d}</div></div>`;
      }

      // Current month days
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = isCurrentMonth && today.getDate() === d;
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayEvts = events.filter(e => e.date === dateStr);

        grid.innerHTML += `
          <div class="day-cell ${isToday ? 'today' : ''}" onclick="selectDate('${dateStr}')">
            <div class="day-num">${d}</div>
            <div class="day-events">
              ${dayEvts.map(e => `
                <div class="event-chip" style="background:${e.color};" title="${e.title} (${e.startTime})">
                  ${e.title}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Trailing next month days
      const totalCells = firstDay + daysInMonth;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= nextDays; i++) {
        grid.innerHTML += `<div class="day-cell other-month"><div class="day-num">${i}</div></div>`;
      }
    }

    function renderAgenda() {
      const list = document.getElementById('agendaList');
      const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
      if (sorted.length === 0) {
        list.innerHTML = '<div style="font-size:11px; color:#64748b;">No upcoming events</div>';
        return;
      }
      list.innerHTML = sorted.slice(0, 8).map(e => `
        <div class="agenda-item" style="border-left-color:${e.color};">
          <div class="agenda-item-title">${e.title}</div>
          <div class="agenda-item-time">${e.date} • ${e.startTime} - ${e.endTime}</div>
        </div>
      `).join('');
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function setView(v) {
      currentView = v;
      document.getElementById('btnMonthView').className = 'view-btn' + (v === 'month' ? ' active' : '');
      document.getElementById('btnWeekView').className = 'view-btn' + (v === 'week' ? ' active' : '');
      renderCalendar();
    }

    function selectDate(dateStr) {
      document.getElementById('evtDate').value = dateStr;
      document.getElementById('eventModal').style.display = 'flex';
    }

    function openNewEventModal() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('evtDate').value = todayStr;
      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeEventModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    async function saveEvent() {
      const title = document.getElementById('evtTitle').value.trim() || 'New Event';
      const date = document.getElementById('evtDate').value;
      const startTime = document.getElementById('evtStartTime').value;
      const endTime = document.getElementById('evtEndTime').value;
      const color = document.getElementById('evtCategory').value;

      const newEvt = {
        id: 'evt-' + Date.now(),
        title,
        date,
        startTime,
        endTime,
        color
      };

      events.push(newEvt);
      closeEventModal();
      document.getElementById('evtTitle').value = '';
      renderCalendar();
      renderAgenda();

      // Persist to Universal State
      try {
        await LoomSDK.state.set({
          id: newEvt.id,
          type: 'calendar_event',
          title: newEvt.title,
          content: JSON.stringify(newEvt),
          tags: ['calendar', 'agenda', date],
          links: []
        });
      } catch (e) {}
    }

    renderCalendar();
    renderAgenda();
  </script>
</body>
</html>
